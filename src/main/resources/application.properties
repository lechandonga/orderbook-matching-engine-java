server.port=0
spring.application.name=orderbook-matching-engine

# ---- 撮合引擎配置 ----
# 事件日志（JSONL）。首次启动若文件不存在，将播种下方账户并写入 ACCOUNT_OPENED 事件。
matching.ledger-path=data/events.jsonl
matching.max-price=1000000
matching.min-order-quantity=1
matching.max-order-quantity=1000000000

# 播种账户（金额单位：展示货币，价格精度 1e-8；positions 单位：股/份）
matching.seed-accounts.alice.initial-cash=100000
matching.seed-accounts.alice.max-cash=100000
matching.seed-accounts.alice.max-exposure=100000
matching.seed-accounts.alice.positions.AAPL=100

matching.seed-accounts.bob.initial-cash=50000
matching.seed-accounts.bob.max-cash=50000
matching.seed-accounts.bob.max-exposure=50000
matching.seed-accounts.bob.positions.AAPL=50
